name: Branch Name

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the source branch follows the naming convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(feature|bug|task)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch must be feature/<name>, bug/<name> or task/<name>, where <name> is lowercase-with-hyphens"
            exit 1
          fi
