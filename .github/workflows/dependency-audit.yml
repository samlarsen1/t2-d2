name: Dependency Audit

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Audit locked dependencies
        run: |
          uv export --frozen --all-packages --no-emit-workspace --no-hashes \
            --format requirements-txt -o "$RUNNER_TEMP/requirements.txt" >/dev/null
          uv run --frozen --no-sync pip-audit --strict --disable-pip --no-deps \
            -r "$RUNNER_TEMP/requirements.txt"
