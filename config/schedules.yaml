# T2-D2 Schedule Configuration
# Each session runs at a fixed time in its market's local time zone, so runs
# track daylight-saving changes automatically.
# `schedule` uses systemd OnCalendar format; install.md generates the systemd
# timers from it. After changing a schedule, re-run install.md step 7.

sessions:
  eu_morning:
    schedule: "Mon..Fri 08:30 Europe/London"     # 30 min after LSE/Xetra/Euronext open (08:00)
    description: EU/London market open
    enabled: true
    markets: [uk, europe]
    action: trade                   # trade | analyse | report

  eu_afternoon:
    schedule: "Mon..Fri 15:30 Europe/London"     # 1 hour before LSE/Xetra/Euronext close (16:30)
    description: EU pre-close session
    enabled: true
    markets: [uk, europe]
    action: trade

  us_morning:
    schedule: "Mon..Fri 10:00 America/New_York"  # 30 min after NYSE/NASDAQ open (09:30)
    description: US market open
    enabled: true
    markets: [us]
    action: trade

  us_afternoon:
    schedule: "Mon..Fri 15:00 America/New_York"  # 1 hour before NYSE/NASDAQ close (16:00)
    description: US pre-close session
    enabled: true
    markets: [us]
    action: trade

  daily_close_wrap:
    schedule: "Mon..Fri 17:00 America/New_York"  # after US close
    description: End-of-day portfolio summary
    enabled: true
    markets: [uk, europe, us]
    action: report                  # No trades, only logs a portfolio summary

