# T2-D2 Schedule Configuration
# All times in UTC. Schedules align with major market open/close windows.
# Cloud Scheduler cron expressions: minute hour day month day-of-week

sessions:
  eu_morning:
    cron: "30 7 * * 1-5"          # 07:30 UTC = 08:30 GMT / 09:30 CET
    description: EU/London market open
    enabled: true
    markets: [uk, europe]
    action: trade                   # trade | analyse | report

  eu_afternoon:
    cron: "0 13 * * 1-5"           # 13:00 UTC = 14:00 BST / 15:00 CET
    description: EU mid-session rebalance
    enabled: true
    markets: [uk, europe]
    action: trade

  us_morning:
    cron: "30 14 * * 1-5"          # 14:30 UTC = 09:30 ET (NYSE/NASDAQ open)
    description: US market open
    enabled: true
    markets: [us]
    action: trade

  us_afternoon:
    cron: "30 18 * * 1-5"          # 18:30 UTC = 13:30 ET
    description: US afternoon session
    enabled: true
    markets: [us]
    action: trade

  daily_close_wrap:
    cron: "0 21 * * 1-5"           # 21:00 UTC = 17:00 ET (after US close)
    description: End-of-day portfolio summary notification
    enabled: true
    markets: [uk, europe, us]
    action: report                  # No trades, only pushes summary notification

# Blackout dates — no trading on these dates (YYYY-MM-DD)
# These are approximate; update annually
blackout_dates:
  uk:
    - "2026-01-01"  # New Year
    - "2026-04-03"  # Good Friday
    - "2026-04-06"  # Easter Monday
    - "2026-05-04"  # Early May Bank Holiday
    - "2026-05-25"  # Spring Bank Holiday
    - "2026-08-31"  # Summer Bank Holiday

  us:
    - "2026-01-01"  # New Year
    - "2026-01-19"  # MLK Day
    - "2026-02-16"  # Presidents Day
    - "2026-04-03"  # Good Friday
    - "2026-05-25"  # Memorial Day
    - "2026-07-03"  # Independence Day (observed)
    - "2026-09-07"  # Labor Day
    - "2026-11-26"  # Thanksgiving
    - "2026-11-27"  # Day after Thanksgiving (early close)
