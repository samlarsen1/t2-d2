# T2-D2 Strategy Configuration
# Controls how aggressively T2-D2 responds to downtrends.

# Strategy modes — each ticker in stocks.yaml picks one via its `strategy` attribute
modes:
  deep_value:
    description: >
      More cautious than mild. Ignores daily dips and only buys a stock that is in a major,
      sustained downtrend: at or near its 52-week low, or down sharply over the last quarter
      or half year and still below its 50-day SMA. Evaluated once a week only.
    # Signal to respond to: daily_dip (default) | long_term_downtrend
    trigger: long_term_downtrend
    # Any one of these triggers a buy (leave one out to disable it)
    # Latest close within this % of the lowest close of the last year (needs a year of prices)
    max_pct_above_52w_low: 2.0
    # Fell at least this much over the last quarter (~63 trading days)
    min_quarter_change_pct: -20.0
    # Fell at least this much over the last half year (~126 trading days)
    min_half_year_change_pct: -30.0
    # Only evaluate this mode's tickers on this weekday, in these sessions. Wednesday has the
    # fewest UK/US market holidays (none in 2026–27, see schedules.yaml blackout_dates).
    # deep_value_midweek runs while EU and US markets are both open; if either market has a
    # holiday that Wednesday, the week is skipped.
    trade_weekday: wednesday
    trade_sessions: [deep_value_midweek]
    # deep_value buys long slides, where the 200-day SMA is almost always falling, so it skips
    # the rising-SMA gate that every other mode applies (default: true)
    require_rising_trend_sma: false
    max_position_increase_pct: 3.0
    max_cash_deploy_pct: 3.0
    order_type: limit
    limit_discount_pct: 1.0
    max_portfolio_weight_pct: 7.5
    min_trade_gbp: 10.0

  mild:
    description: >
      Conservative DCA. Only buys on meaningful dips with small position increases.
      Suitable for stable long-term compounding with minimal risk.
    # Minimum daily decline before considering a buy
    min_daily_dip_pct: -3.0
    # Minimum weekly decline to confirm downtrend
    min_weekly_dip_pct: -4.0
    # Optional flag to require both daily and weekly trends
    require_both_timeframes: true
    # Maximum additional investment as % of current position value
    max_position_increase_pct: 5.0
    # Maximum % of available ISA cash to deploy in a single run
    max_cash_deploy_pct: 5.0
    # Order type: market | limit
    order_type: limit
    # Limit order: buy at X% below current price
    limit_discount_pct: 0.5
    # Don't trade if position already exceeds this % of total portfolio
    max_portfolio_weight_pct: 10.0
    # Skip the trade if it would be smaller than this (£)
    min_trade_gbp: 10.0

  moderate:
    description: >
      Balanced DCA. Responds to smaller dips with moderate position increases.
      Good for active rebalancing during volatile periods.
    min_daily_dip_pct: -2.0
    max_position_increase_pct: 10.0
    max_cash_deploy_pct: 10.0
    order_type: limit
    limit_discount_pct: 0.3
    max_portfolio_weight_pct: 12.5
    min_trade_gbp: 30.0

  aggressive:
    description: >
      Active opportunistic buying. Responds to small dips with larger capital deployment.
      Higher risk — ensure you have sufficient cash buffer before enabling.
    min_daily_dip_pct: -1.0
    max_position_increase_pct: 15.0
    max_cash_deploy_pct: 15.0
    order_type: limit
    limit_discount_pct: 0.1
    max_portfolio_weight_pct: 17.5
    min_trade_gbp: 50.0

# Global safety limits — enforced regardless of mode
global_limits:
  # Never deploy more than this % of total ISA value in a single run
  absolute_max_cash_deploy_pct: 50.0
  # Minimum cash buffer to keep in ISA at all times (£)
  min_cash_reserve_gbp: 100.0
  # Raise any smaller percentage-based trade to this amount (£). Overrides the percentage limits
  # but never min_cash_reserve_gbp: a trade that can't reach this without using the reserve is
  # skipped. Set to 0 to disable.
  min_trade_floor_gbp: 100.0
  # Cancel the bot's unfilled limit buy orders once they reach this age, at the next trading
  # session. Trading212 has no expiry date option, so orders are placed as good-till-cancel.
  limit_order_expiry_days: 7
  # Maximum number of distinct trades per run
  max_trades_per_run: 3
  # Cooldown: don't re-buy a ticker within this many hours of last trade
  ticker_cooldown_hours: 72

# Trend analysis settings
analysis:
  # Number of days for short-term trend (daily)
  daily_lookback_days: 10
  # Number of days for medium-term trend (weekly)
  weekly_lookback_days: 30
  # RSI period — avoid buying when RSI is still high (not oversold)
  rsi_period: 14
  # Don't buy if RSI is above this (not yet oversold)
  rsi_max_buy: 55
  # Simple moving average periods for trend confirmation
  sma_short: 20
  sma_long: 50
  # Trading days behind the long-term signals used by the long_term_downtrend trigger
  quarter_lookback_days: 63
  half_year_lookback_days: 126
  year_lookback_days: 252
  # Buys in modes with require_rising_trend_sma (all but deep_value) need the trend SMA
  # (trend_sma_days) to be higher than it was trend_slope_days trading days earlier. Their
  # tickers without trend_sma_days + trend_slope_days of price history are never bought.
  trend_sma_days: 200
  trend_slope_days: 20
