# T2-D2 Strategy Configuration
# Controls how aggressively T2-D2 responds to downtrends.

# Strategy modes — each ticker in stocks.yaml picks one via its `strategy` attribute
modes:
  mild:
    description: >
      Conservative DCA. Only buys on meaningful dips with small position increases.
      Suitable for stable long-term compounding with minimal risk.
    # Minimum daily decline before considering a buy
    min_daily_dip_pct: -3.0
    # Minimum weekly decline to confirm downtrend
    min_weekly_dip_pct: -4.0
    # Optional flag to require both daily and weekly trends
    require_both_timeframes: true
    # Maximum additional investment as % of current position value
    max_position_increase_pct: 5.0
    # Maximum % of available ISA cash to deploy in a single run
    max_cash_deploy_pct: 5.0
    # Order type: market | limit
    order_type: limit
    # Limit order: buy at X% below current price
    limit_discount_pct: 0.5
    # Don't trade if position already exceeds this % of total portfolio
    max_portfolio_weight_pct: 10.0
    # Minimum single trade size (£)
    min_trade_gbp: 10.0

  moderate:
    description: >
      Balanced DCA. Responds to smaller dips with moderate position increases.
      Good for active rebalancing during volatile periods.
    min_daily_dip_pct: -2.0
    max_position_increase_pct: 10.0
    max_cash_deploy_pct: 10.0
    order_type: limit
    limit_discount_pct: 0.3
    max_portfolio_weight_pct: 12.5
    min_trade_gbp: 30.0

  aggressive:
    description: >
      Active opportunistic buying. Responds to small dips with larger capital deployment.
      Higher risk — ensure you have sufficient cash buffer before enabling.
    min_daily_dip_pct: -1.0
    max_position_increase_pct: 15.0
    max_cash_deploy_pct: 15.0
    order_type: limit
    limit_discount_pct: 0.1
    max_portfolio_weight_pct: 17.5
    min_trade_gbp: 50.0

# Global safety limits — enforced regardless of mode
global_limits:
  # Never deploy more than this % of total ISA value in a single run
  absolute_max_cash_deploy_pct: 50.0
  # Minimum cash buffer to keep in ISA at all times (£)
  min_cash_reserve_gbp: 100.0
  # Maximum number of distinct trades per run
  max_trades_per_run: 3
  # Cooldown: don't re-buy a ticker within this many hours of last trade
  ticker_cooldown_hours: 72

# Trend analysis settings
analysis:
  # Number of days for short-term trend (daily)
  daily_lookback_days: 10
  # Number of days for medium-term trend (weekly)
  weekly_lookback_days: 30
  # RSI period — avoid buying when RSI is still high (not oversold)
  rsi_period: 14
  # Don't buy if RSI is above this (not yet oversold)
  rsi_max_buy: 55
  # Simple moving average periods for trend confirmation
  sma_short: 20
  sma_long: 50
