[project]
name = "t2d2-scheduler"
version = "0.1.0"
description = "T2-D2 Cloud Run Job scheduler entrypoint"
requires-python = ">=3.12"
dependencies = [
    "t2d2-client",
    "t2d2-market-data",
    "t2d2-algo",
    "t2d2-notifier",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[tool.uv.sources]
t2d2-client = { workspace = true }
t2d2-market-data = { workspace = true }
t2d2-algo = { workspace = true }
t2d2-notifier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]
