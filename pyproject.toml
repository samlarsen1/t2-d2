[tool.uv.workspace]
members = [
    "packages/t2d2-client",
    "packages/t2d2-market-data",
    "packages/t2d2-algo",
    "services/scheduler",
]

[tool.uv]
dev-dependencies = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ruff>=0.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
asyncio_mode = "auto"
