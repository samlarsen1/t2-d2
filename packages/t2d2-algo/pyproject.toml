[project]
name = "t2d2-algo"
version = "0.1.0"
description = "Trading algorithm engine for T2-D2"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "t2d2-client",
    "t2d2-market-data",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv.sources]
t2d2-client = { workspace = true }
t2d2-market-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2d2_algo"]
